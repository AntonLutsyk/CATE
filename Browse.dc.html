<div class="b-filters" style="display:flex;flex-wrap:wrap;justify-content:flex-start;gap:12px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--border)">
<x-import component-from-global-scope="CATDesignSystem_3eda1e.FilterChip" icon="sliders-horizontal" selected="{{ moreOpen }}" aria-expanded="{{ moreOpenS }}" on-click="{{ toggleMore }}" hint-size="auto,40px">{{ moreLabel }}</x-import>
<x-import component-from-global-scope="CATDesignSystem_3eda1e.FilterChip" selected="{{ nearOn }}" count="{{ nNear }}" on-click="{{ toggleNear }}" hint-size="auto,40px">Within 10 mi</x-import>
<x-import component-from-global-scope="CATDesignSystem_3eda1e.FilterChip" selected="{{ kidsOn }}" count="{{ nKids }}" on-click="{{ toggleKids }}" hint-size="auto,40px">Good with kids</x-import>
<x-import component-from-global-scope="CATDesignSystem_3eda1e.FilterChip" selected="{{ catsOn }}" count="{{ nCats }}" on-click="{{ toggleCats }}" hint-size="auto,40px">Lives with cats</x-import>
<x-import component-from-global-scope="CATDesignSystem_3eda1e.FilterChip" selected="{{ dogsOn }}" count="{{ nDogs }}" on-click="{{ toggleDogs }}" hint-size="auto,40px">Good with dogs</x-import>
<span aria-hidden="true" class="b-hide-m" style="width:1px;height:32px;background:#DDD3C2;margin-left:auto"></span>
<x-import component-from-global-scope="CATDesignSystem_3eda1e.SegmentedControl" label="Age" value="{{ age }}" on-change="{{ setAge }}" options="{{ ageOptions }}" hint-size="320px,40px"></x-import>
</div>
<sc-if value="{{ moreOpen }}" hint-placeholder-val="{{ false }}">
<div id="more-filters" style="display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;padding:20px 0;border-bottom:1px solid var(--border)">
<div style="display:flex;align-items:center;gap:12px"><span style="font:600 14px/1 var(--font-sans);color:#3A352E">Sex</span><x-import component-from-global-scope="CATDesignSystem_3eda1e.SegmentedControl" label="Sex" value="{{ sex }}" on-change="{{ setSex }}" options="{{ sexOptions }}" hint-size="220px,40px"></x-import></div>
<x-import component-from-global-scope="CATDesignSystem_3eda1e.Checkbox" label="Hide cats with a pending application" checked="{{ hidePending }}" on-change="{{ togglePending }}" hint-size="auto,28px"></x-import>
</div>
</sc-if>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:16px;min-height:48px">
<sc-for list="{{ tags }}" as="t" hint-placeholder-count="0">
<x-import component-from-global-scope="CATDesignSystem_3eda1e.Tag" on-remove="{{ t.remove }}" hint-size="auto,32px">{{ t.label }}</x-import>
</sc-for>
<sc-if value="{{ hasTags }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="CATDesignSystem_3eda1e.Button" variant="ghost" size="s" on-click="{{ clearAll }}" hint-size="auto,32px">Clear all</x-import></sc-if>
<span aria-live="polite" style="margin-left:auto;font:500 15px/1 var(--font-sans);color:#6F665B">{{ resultsLabel }}</span>
</div>

<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:40px;border-top:0">
<x-import component-from-global-scope="CATDesignSystem_3eda1e.EmptyState" title="No cats match all of that — yet." photo="photos/ginger-sleep.jpg" actions="{{ emptyActions }}" hint-size="100%,320px">{{ emptyHint }}</x-import>
</div>
</sc-if>

<sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}">
<div class="b-grid cate-cards" style="display:grid;column-gap:var(--grid-gutter);row-gap:56px;margin-top:40px">
<sc-for list="{{ first }}" as="c" hint-placeholder-count="4">
<x-import component-from-global-scope="CATDesignSystem_3eda1e.CatCard" cat="{{ c }}" href="Profile.dc.html?id={{ c.id }}" hint-size="100%,440px"></x-import>
</sc-for>
<sc-if value="{{ showBlockA }}" hint-placeholder-val="{{ true }}">
<div class="b-span2" style="display:flex">
<x-import component-from-global-scope="CATDesignSystem_3eda1e.ColorBlock" tone="sage" eyebrow="Saved search" title="{{ alertTitle }}" line="{{ alertLine }}" link-label="{{ alertLink }}" href="{{ alertHref }}" on-click="{{ saveSearch }}" style="flex:1" hint-size="100%,300px"></x-import>
</div>
</sc-if>
<sc-for list="{{ second }}" as="c" hint-placeholder-count="2">
<x-import component-from-global-scope="CATDesignSystem_3eda1e.CatCard" cat="{{ c }}" href="Profile.dc.html?id={{ c.id }}" hint-size="100%,440px"></x-import>
</sc-for>
<sc-if value="{{ showBlockB }}" hint-placeholder-val="{{ true }}">
<div class="b-span2" style="display:flex">
<x-import component-from-global-scope="CATDesignSystem_3eda1e.ColorBlock" tone="charcoal" eyebrow="Waiting 212 days" title="Walter, 12" line="A retired gentleman seeking a warm radiator. Fee waived for seniors this month." link-label="Meet Walter" href="Profile.dc.html?id=0088" photo="photos/ginger-stretch.jpg" photo-shape="pebble" style="flex:1" hint-size="100%,300px"></x-import>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
<div style="display:grid;gap:12px;margin-top:32px;max-width:860px">
<sc-for list="{{ all }}" as="c" hint-placeholder-count="4">
<x-import component-from-global-scope="CATDesignSystem_3eda1e.CatCard" variant="row" cat="{{ c }}" href="Profile.dc.html?id={{ c.id }}" hint-size="100%,96px"></x-import>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ hasPages }}" hint-placeholder-val="{{ true }}">
<div class="b-pages" style="margin-top:64px;padding-top:24px;border-top:1px solid var(--border)">
<x-import component-from-global-scope="CATDesignSystem_3eda1e.Pagination" page="{{ page }}" total="{{ pages }}" on-change="{{ setPage }}" summary="{{ pageSummary }}" hint-size="100%,48px"></x-import>
</div>
</sc-if>
</main>
<x-import component-from-global-scope="CATDesignSystem_3eda1e.Footer" hint-size="100%,360px"></x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { kids: false, cats: false, dogs: false, near: false, age: "Any", sex: "Any", hidePending: false, sort: "long", view: "grid", page: 1, more: false, alerted: false, sheet: false };
  componentDidMount() {
    const q = new URLSearchParams(location.search); const a = (q.get("age") || "").toLowerCase();
    const map = { kitten: "Kitten", young: "Young", adult: "Adult", senior: "Senior" };
    const n = {}; if (map[a]) n.age = map[a]; ["kids", "cats", "dogs"].forEach((k) => { if (q.get(k) === "1") n[k] = true; });
    if (Object.keys(n).length) this.setState(n);
    if (!window.CATE_MOCK) this.t = setInterval(() => { if (window.CATE_MOCK) { clearInterval(this.t); this.forceUpdate(); } }, 40);
  }
  componentWillUnmount() { clearInterval(this.t); document.documentElement.style.overflow = ""; }
  sheet(on) { this.setState({ sheet: on }); document.documentElement.style.overflow = on ? "hidden" : ""; if (on) { this.esc = (e) => { if (e.key === "Escape") this.sheet(false); }; document.addEventListener("keydown", this.esc); } else document.removeEventListener("keydown", this.esc); }
  set(p) { this.setState({ ...p, page: p.page || 1 }); if (p.page) { const el = document.querySelector(".b-lead"); el && window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 96, behavior: "smooth" }); } }
  renderVals() {
    const D = window.CATE_MOCK, st = this.state;
    const base = {
      sortOptions: [{ value: "long", label: "Waiting longest" }, { value: "new", label: "Newest first" }, { value: "near", label: "Nearest" }],
      viewOptions: [{ value: "grid", label: "Grid" }, { value: "list", label: "List" }],
      ageOptions: ["Any", "Kitten", "Young", "Adult", "Senior"], sexOptions: ["Any", "Female", "Male"],
      sort: st.sort, view: st.view, age: st.age, sex: st.sex, hidePending: st.hidePending, page: st.page,
      kidsOn: st.kids, catsOn: st.cats, dogsOn: st.dogs, nearOn: st.near, moreOpen: st.more, moreOpenS: st.more ? "true" : "false",
      isGrid: st.view === "grid", isList: st.view === "list",
      setSort: (v) => this.set({ sort: v }), setView: (v) => this.set({ view: v }), setAge: (v) => this.set({ age: v }), setSex: (v) => this.set({ sex: v }),
      toggleKids: () => this.set({ kids: !st.kids }), toggleCats: () => this.set({ cats: !st.cats }), toggleDogs: () => this.set({ dogs: !st.dogs }), toggleNear: () => this.set({ near: !st.near }),
      togglePending: () => this.set({ hidePending: !st.hidePending }), toggleMore: () => this.setState({ more: !st.more }),
      setPage: (p) => this.set({ page: p }),
      sheetOpen: st.sheet, openSheet: () => this.sheet(true), closeSheet: () => this.sheet(false), sheetBg: (e) => { if (e.target === e.currentTarget) this.sheet(false); },
      headline: "Cats waiting in Kyiv.", resultsLabel: "", first: [], second: [], all: [], tags: [],
    };
    if (!D) return base;
    const dist = {}; (D.sheltersAll || []).forEach((s) => { dist[s.name] = parseFloat(s.distance) || 99; });
    const yrs = (a) => { const n = parseFloat(a) || 0; return /mo/.test(a) ? n / 12 : n; };
    const band = (c) => { const y = yrs(c.age); return y < 1 ? "Kitten" : y < 4 ? "Young" : y < 10 ? "Adult" : "Senior"; };
    const pool = D.cats.filter((c) => c.status !== "adopted");
    const pass = (c, skip) => (skip === "kids" || !st.kids || c.compat.kids === "yes") && (skip === "cats" || !st.cats || c.compat.cats === "yes") && (skip === "dogs" || !st.dogs || c.compat.dogs === "yes")
      && (skip === "near" || !st.near || (dist[c.shelter] || 99) <= 10) && (skip === "age" || st.age === "Any" || band(c) === st.age)
      && (st.sex === "Any" || c.sex === st.sex) && (!st.hidePending || c.status !== "pending");
    const cnt = (k, f) => pool.filter((c) => pass(c, k) && f(c)).length;
    let list = pool.filter((c) => pass(c));
    const S = { long: (a, b) => (b.waiting || 0) - (a.waiting || 0), new: (a, b) => (b.status === "new") - (a.status === "new") || b.id.localeCompare(a.id), near: (a, b) => (dist[a.shelter] || 99) - (dist[b.shelter] || 99) };
    list = list.slice().sort(S[st.sort] || S.long);
    const n = list.length, per = st.view === "grid" ? 8 : 12, pages = Math.max(1, Math.ceil(n / per)), page = Math.min(st.page, pages);
    const slice = list.slice((page - 1) * per, page * per);
    const tags = [];
    if (st.near) tags.push({ label: "Within 10 mi", remove: () => this.set({ near: false }) });
    if (st.kids) tags.push({ label: "Good with kids", remove: () => this.set({ kids: false }) });
    if (st.cats) tags.push({ label: "Lives with cats", remove: () => this.set({ cats: false }) });
    if (st.dogs) tags.push({ label: "Good with dogs", remove: () => this.set({ dogs: false }) });
    if (st.age !== "Any") tags.push({ label: st.age, remove: () => this.set({ age: "Any" }) });
    if (st.sex !== "Any") tags.push({ label: st.sex, remove: () => this.set({ sex: "Any" }) });
    if (st.hidePending) tags.push({ label: "No pending", remove: () => this.set({ hidePending: false }) });
    const ageWord = { Kitten: "kittens", Young: "young cats", Adult: "adult cats", Senior: "senior cats" }[st.age] || "cats";
    const quals = [st.kids && "good with kids", st.cats && "fine with other cats", st.dogs && "good with dogs"].filter(Boolean);
    const num = n === 1 ? "One " + ageWord.replace(/s$/, "").replace(/ies$/, "y") : n + " " + ageWord;
    const headline = n === 0 ? "No matches yet." : quals.length ? num + (n === 1 ? " who is " : " who are ") + (quals.length > 2 ? quals.slice(0, -1).join(", ") + " and " + quals[quals.length - 1] : quals.join(" and ")) + "." : num + (st.near ? " within 10 miles." : " waiting in Kyiv.");
    const reset = () => this.set({ kids: false, cats: false, dogs: false, near: false, age: "Any", sex: "Any", hidePending: false });
    const loosen = tags.length ? tags[tags.length - 1] : null;
    const Btn = window.CATDesignSystem_3eda1e && window.CATDesignSystem_3eda1e.Button;
    return { ...base,
      nKids: cnt("kids", (c) => c.compat.kids === "yes"), nCats: cnt("cats", (c) => c.compat.cats === "yes"), nDogs: cnt("dogs", (c) => c.compat.dogs === "yes"), nNear: cnt("near", (c) => (dist[c.shelter] || 99) <= 10),
      moreLabel: (st.sex !== "Any" || st.hidePending) ? "More filters · " + ((st.sex !== "Any") + st.hidePending) : "More filters",
      headline, tags, hasTags: tags.length > 0, noTags: tags.length === 0, clearAll: reset, activeCountS: tags.length ? tags.length : undefined, showLabel: n === 0 ? "No cats match" : "Show " + (n === 1 ? "1 cat" : n + " cats"),
      resultsLabel: n === 1 ? "1 cat" : n + " cats", isEmpty: n === 0,
      emptyHint: loosen ? "Try removing “" + loosen.label + "” — " + (pool.filter((c) => pass(c, { "Good with kids": "kids", "Lives with cats": "cats", "Good with dogs": "dogs", "Within 10 mi": "near" }[loosen.label] || "age")).length) + " cats appear." : "Try another combination.",
      emptyActions: Btn ? React.createElement(Btn, { onClick: reset }, "Clear filters") : null,
      first: st.view === "grid" ? slice.slice(0, 4) : [], second: st.view === "grid" ? slice.slice(4, 8) : [], all: st.view === "list" ? slice : [],
      showBlockA: st.view === "grid" && slice.length > 4 && page === 1, showBlockB: st.view === "grid" && slice.length >= 8 && page === 1,
      alertTitle: st.alerted ? "We'll let you know." : "Hear about new cats first", alertLine: st.alerted ? "Saved. Change how often we email in your account settings." : "We'll email when a new cat matching these filters arrives. Usually within a week.",
      alertLink: st.alerted ? "Email settings" : "Save this search",
      alertHref: st.alerted ? "Account.dc.html" : "", saveSearch: st.alerted ? undefined : () => this.setState({ alerted: true }),
      page, pages, hasPages: pages > 1, pageSummary: n ? "Showing " + ((page - 1) * per + 1) + "–" + Math.min(n, page * per) + " of " + n : "",
    };
  }
}
</script>
</body>
</html>
